<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBNL - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-content">
                <h2>Enter Verification Code</h2>
                <p>We've sent a 6-digit code to your@gmail.com</p>
                
                <div class="auth-tabs">
                    <button class="tab-btn" data-tab="phone">
                        <span class="indicator"></span>
                        Phone
                    </button>
                    <button class="tab-btn active" data-tab="verify">
                        <span class="indicator"></span>
                        Verify
                    </button>
                </div>
                
                <form class="auth-form" action="profiles.html" method="get">
                    <div class="otp-input-group">
                        <input name="otp1" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input name="otp2" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input name="otp3" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input name="otp4" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input name="otp5" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input name="otp6" type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    </div>
                    <p class="otp-timer">Didn't receive the code? <span style="color:var(--accent-color);">00:59</span></p>
                </form>
            </div>
        </div>
    </div>
    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const form = document.querySelector('.auth-form');

        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value) {
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    } else {
                        form.submit();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
