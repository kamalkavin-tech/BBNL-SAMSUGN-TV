<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBNL - Player</title>
    <!-- Axios Library -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <!-- Base Styles -->
    <link rel="stylesheet" href="css/base/variable.css">
    <link rel="stylesheet" href="css/base/reset.css">
    <!-- Component Styles -->
    <link rel="stylesheet" href="css/componentes/buttons.css">
    <link rel="stylesheet" href="css/componentes/remote.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/script.js"></script>
    <!-- Remote Control -->
    <script src="js/remote.js"></script>
    <!-- HLS.js for browser HLS support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- AVPlayer Module -->
    <script src="js/avplayer.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: white;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Video player styles - FULL SCREEN */
        #video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* ==================== INFO OVERLAY ==================== */
        .info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 60%, transparent 100%);
            padding: 40px 40px 20px 40px;
            z-index: 20;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .info-overlay.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Channel Info Section */
        .channel-info {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 15px;
        }

        .channel-logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-logo-text {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            padding: 5px;
            line-height: 1.2;
        }

        .channel-details {
            flex: 1;
        }

        .channel-number {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .channel-name {
            font-size: 18px;
            color: #fff;
            margin-top: 4px;
            font-weight: 500;
        }

        .channel-expiry {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* Program Info Section */
        .program-info {
            margin-left: 100px;
            flex: 2;
        }

        .program-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .program-time {
            font-size: 14px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Progress Bar */
        .program-progress {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar-container {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #64b5f6);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .up-next {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        .up-next span {
            color: #aaa;
        }

        /* Right Controls */
        .overlay-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .control-btn:hover, .control-btn:focus {
            background: rgba(255,255,255,0.2);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 15px;
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: #666;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-label {
            color: #555;
        }

        .status-value {
            color: #888;
        }

        /* ==================== CHANNEL SEARCH OVERLAY ==================== */
        .channel-search-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px 40px;
            border-radius: 12px;
            border: 2px solid #ffc107;
            display: none;
            z-index: 100;
            min-width: 300px;
        }

        .channel-search-overlay.show {
            display: block;
        }

        .channel-search-overlay h3 {
            margin: 0 0 20px 0;
            color: #ffc107;
            text-align: center;
            font-size: 20px;
        }

        .channel-input {
            width: 100%;
            padding: 12px;
            font-size: 24px;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            text-align: center;
            outline: none;
        }

        .channel-input:focus {
            border-color: #ffc107;
        }

        .channel-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        /* ==================== BUFFERING INDICATOR ==================== */
        .buffering-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 50;
        }

        .buffering-indicator i {
            font-size: 48px;
            color: #ffc107;
        }

        .buffering-indicator p {
            margin-top: 16px;
            font-size: 14px;
        }

        /* ==================== VOLUME INDICATOR ==================== */
        .volume-indicator {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 30;
            text-align: center;
        }

        .volume-indicator.show {
            display: block;
        }

        .volume-indicator i {
            font-size: 32px;
            color: #ffc107;
        }

        .volume-bar {
            width: 8px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin: 15px auto 10px;
            position: relative;
        }

        .volume-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffc107;
            border-radius: 4px;
            transition: height 0.2s;
        }

        .volume-text {
            font-size: 14px;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="player-container">
        <div class="video-wrapper" id="video-wrapper">
            <!-- HTML5 Video Player -->
            <video id="video-player" width="100%" height="100%" autoplay>
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Dynamic Info Overlay -->
        <div class="info-overlay" id="info-overlay">
            <div class="channel-info">
                <!-- Channel Logo & Details -->
                <div class="channel-logo" id="channel-logo">
                    <div class="channel-logo-text" id="channel-logo-text">TV</div>
                </div>
                <div class="channel-details">
                    <div class="channel-number" id="channel-number">001</div>
                    <div class="channel-name" id="channel-name">Loading...</div>
                    <div class="channel-expiry" id="channel-expiry"></div>
                </div>

                <!-- Program Info -->
                <div class="program-info">
                    <div class="program-title" id="program-title">Loading Program...</div>
                    <div class="program-time" id="program-time">--:-- - --:--</div>
                    <div class="program-progress">
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="program-progress" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="up-next" id="up-next">Up Next: <span>--</span></div>
                </div>

                <!-- Controls -->
                <div class="overlay-controls">
                    <button class="control-btn" id="btn-subtitle" title="Subtitles">
                        <i class="fas fa-closed-captioning"></i>
                    </button>
                    <button class="control-btn" id="btn-more" title="More Options">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-item">
                        <span class="status-label">EPG:</span>
                        <span class="status-value" id="epg-id">--</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Status:</span>
                        <span class="status-value" id="subscription-status">--</span>
                    </div>
                </div>
                <div class="status-right">
                    <div class="status-item">
                        <span class="status-label">User:</span>
                        <span class="status-value" id="user-id">--</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">TV ID:</span>
                        <span class="status-value" id="tv-id">--</span>
                    </div>
                    <div class="status-item">
                        <span class="status-value" id="current-date">--</span>
                    </div>
                    <div class="status-item">
                        <span class="status-value" id="current-time">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Volume Indicator -->
        <div class="volume-indicator" id="volume-indicator">
            <i class="fas fa-volume-up" id="volume-icon"></i>
            <div class="volume-bar">
                <div class="volume-level" id="volume-level" style="height: 100%;"></div>
            </div>
            <div class="volume-text" id="volume-text">100%</div>
        </div>

        <!-- Channel Search Overlay -->
        <div class="channel-search-overlay" id="channel-search-overlay">
            <h3>Enter Channel Number</h3>
            <input type="text" id="channel-number-input" class="channel-input" maxlength="4" inputmode="numeric" placeholder="0000">
            <p class="channel-hint">Press Enter to switch channel</p>
        </div>
    </div>

    <script>
        // ==================== PLAYER STATE ====================
        var playerState = {
            channelNumber: '001',
            channelName: 'Unknown Channel',
            channelLogo: '',
            programTitle: 'No Program Info',
            programStartTime: null,
            programEndTime: null,
            programProgress: 0,
            upNext: '',
            epgId: '',
            subscriptionStatus: 'Active',
            expiryDays: null,
            userId: '',
            tvId: '',
            overlayVisible: false,
            overlayTimeout: null,
            volumeTimeout: null,
            volume: 100
        };

        // ==================== UTILITY FUNCTIONS ====================
        
        // Format time to HH:MM AM/PM
        function formatTime(date) {
            if (!date) return '--:--';
            var hours = date.getHours();
            var minutes = date.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        // Format date to MMM DD, YYYY
        function formatDate(date) {
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            var day = date.getDate();
            if (day < 10) day = '0' + day;
            return months[date.getMonth()] + ' ' + day + ', ' + date.getFullYear();
        }

        // Pad number with leading zeros
        function padNumber(num, size) {
            var s = String(num);
            while (s.length < size) s = '0' + s;
            return s;
        }

        // ==================== UI UPDATE FUNCTIONS ====================

        function updateChannelInfo() {
            document.getElementById('channel-number').textContent = padNumber(playerState.channelNumber, 3);
            document.getElementById('channel-name').textContent = playerState.channelName;
            
            // Update channel logo
            var logoContainer = document.getElementById('channel-logo');
            var logoText = document.getElementById('channel-logo-text');
            
            if (playerState.channelLogo) {
                logoContainer.innerHTML = '<img src="' + playerState.channelLogo + '" alt="' + playerState.channelName + '">';
            } else {
                // Use channel name abbreviation
                var words = playerState.channelName.split(' ');
                var abbr = '';
                for (var i = 0; i < words.length && i < 3; i++) {
                    if (words[i] && words[i][0]) {
                        abbr += words[i][0];
                    }
                }
                abbr = abbr.toUpperCase() || 'TV';
                logoText.textContent = abbr;
            }

            // Update expiry
            if (playerState.expiryDays !== null && playerState.expiryDays > 0) {
                document.getElementById('channel-expiry').textContent = 'Expires in ' + playerState.expiryDays + ' days';
            } else {
                document.getElementById('channel-expiry').textContent = '';
            }
        }

        function updateProgramInfo() {
            document.getElementById('program-title').textContent = playerState.programTitle || 'No Program Info';
            
            var timeStr = '';
            if (playerState.programStartTime && playerState.programEndTime) {
                timeStr = formatTime(playerState.programStartTime) + ' - ' + formatTime(playerState.programEndTime);
            }
            document.getElementById('program-time').textContent = timeStr || '--:-- - --:--';

            // Update progress bar
            updateProgramProgress();

            // Update next program
            var upNextEl = document.getElementById('up-next');
            if (playerState.upNext) {
                upNextEl.innerHTML = 'Up Next: <span>' + playerState.upNext + '</span>';
                upNextEl.style.display = 'block';
            } else {
                upNextEl.style.display = 'none';
            }
        }

        function updateProgramProgress() {
            if (playerState.programStartTime && playerState.programEndTime) {
                var now = new Date();
                var start = playerState.programStartTime.getTime();
                var end = playerState.programEndTime.getTime();
                var current = now.getTime();
                
                if (current >= start && current <= end) {
                    var progress = ((current - start) / (end - start)) * 100;
                    playerState.programProgress = Math.min(100, Math.max(0, progress));
                } else if (current > end) {
                    playerState.programProgress = 100;
                } else {
                    playerState.programProgress = 0;
                }
            }
            
            document.getElementById('program-progress').style.width = playerState.programProgress + '%';
        }

        function updateStatusBar() {
            document.getElementById('epg-id').textContent = playerState.epgId || '--';
            document.getElementById('subscription-status').textContent = playerState.subscriptionStatus || '--';
            document.getElementById('user-id').textContent = playerState.userId || '--';
            document.getElementById('tv-id').textContent = playerState.tvId || '--';
        }

        function updateDateTime() {
            var now = new Date();
            document.getElementById('current-date').textContent = formatDate(now);
            document.getElementById('current-time').textContent = formatTime(now);
        }

        // ==================== OVERLAY CONTROL ====================

        function showInfoOverlay() {
            var overlay = document.getElementById('info-overlay');
            overlay.classList.add('show');
            playerState.overlayVisible = true;
            
            // Clear existing timeout
            if (playerState.overlayTimeout) {
                clearTimeout(playerState.overlayTimeout);
            }
            
            // Auto-hide after 5 seconds
            playerState.overlayTimeout = setTimeout(function() {
                hideInfoOverlay();
            }, 5000);
        }

        function hideInfoOverlay() {
            var overlay = document.getElementById('info-overlay');
            overlay.classList.remove('show');
            playerState.overlayVisible = false;
        }

        function toggleInfoOverlay() {
            if (playerState.overlayVisible) {
                hideInfoOverlay();
            } else {
                showInfoOverlay();
            }
        }

        // ==================== VOLUME CONTROL ====================

        function showVolumeIndicator(volume) {
            playerState.volume = volume;
            var indicator = document.getElementById('volume-indicator');
            var levelEl = document.getElementById('volume-level');
            var textEl = document.getElementById('volume-text');
            var iconEl = document.getElementById('volume-icon');

            levelEl.style.height = volume + '%';
            textEl.textContent = volume + '%';

            // Update icon based on volume
            if (volume === 0) {
                iconEl.className = 'fas fa-volume-mute';
            } else if (volume < 50) {
                iconEl.className = 'fas fa-volume-down';
            } else {
                iconEl.className = 'fas fa-volume-up';
            }

            indicator.classList.add('show');

            // Clear existing timeout
            if (playerState.volumeTimeout) {
                clearTimeout(playerState.volumeTimeout);
            }

            // Auto-hide after 2 seconds
            playerState.volumeTimeout = setTimeout(function() {
                indicator.classList.remove('show');
            }, 2000);
        }

        // ==================== LOAD CHANNEL DATA ====================

        function loadChannelData() {
            // Get parameters from URL
            var params = new URLSearchParams(window.location.search);
            var title = params.get('title');
            var streamUrl = params.get('stream');
            var channelNum = params.get('channel') || '001';
            var logo = params.get('logo');
            var epg = params.get('epg');

            playerState.channelNumber = channelNum;
            playerState.channelName = title || 'Unknown Channel';
            playerState.channelLogo = logo || '';
            playerState.epgId = epg || title || '--';

            // Load user info from localStorage
            try {
                var userData = localStorage.getItem('bbnl_user');
                if (userData) {
                    var user = JSON.parse(userData);
                    playerState.userId = user.userid || user.mobile || '--';
                }
            } catch (e) {
                console.log('Could not load user data');
            }

            // Get TV ID (device ID)
            try {
                if (typeof tizen !== 'undefined' && tizen.systeminfo) {
                    tizen.systeminfo.getPropertyValue('BUILD', function(build) {
                        playerState.tvId = 'SN_' + (build.model || 'TV').substring(0, 4) + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                        updateStatusBar();
                    }, function() {
                        playerState.tvId = 'TV_' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        updateStatusBar();
                    });
                } else {
                    playerState.tvId = 'EMU_' + Math.random().toString(36).substring(2, 10).toUpperCase();
                }
            } catch (e) {
                playerState.tvId = 'DEV_' + Math.random().toString(36).substring(2, 10).toUpperCase();
            }

            // Set subscription status
            playerState.subscriptionStatus = 'Active';
            playerState.expiryDays = Math.floor(Math.random() * 30) + 1; // Demo: random 1-30 days

            // Generate demo program info
            var now = new Date();
            playerState.programStartTime = new Date(now.getTime() - (30 * 60 * 1000)); // Started 30 mins ago
            playerState.programEndTime = new Date(now.getTime() + (30 * 60 * 1000)); // Ends in 30 mins
            playerState.programTitle = getDemoProgramTitle(playerState.channelName);
            playerState.upNext = getDemoNextProgram(playerState.channelName);

            // Update all UI
            updateChannelInfo();
            updateProgramInfo();
            updateStatusBar();
            updateDateTime();

            return streamUrl;
        }

        // Demo program titles based on channel
        function getDemoProgramTitle(channelName) {
            var programs = {
                'Colors Super TV': 'Big Boss Season 18',
                'Zee TV': 'Kundali Bhagya',
                'Star Plus': 'Anupamaa',
                'Sony TV': 'CID Special',
                'Colors HD': 'Khatron Ke Khiladi',
                'Star Movies': 'John Wick - Chapter 2',
                'HBO': 'Game of Thrones',
                'Udhaya TV': 'Tamil News Live',
                'Gemini TV': 'Telugu Cinema',
                'default': 'Live Broadcast'
            };
            return programs[channelName] || programs['default'];
        }

        function getDemoNextProgram(channelName) {
            var nextPrograms = {
                'Colors Super TV': 'Balerina 2025',
                'Zee TV': 'Kumkum Bhagya',
                'Star Plus': 'Ghum Hai Kisikey Pyaar Meiin',
                'Sony TV': 'Super Dancer',
                'Colors HD': 'Fear Factor',
                'Star Movies': 'Mission Impossible',
                'HBO': 'House of the Dragon',
                'default': 'Coming Up Next'
            };
            return nextPrograms[channelName] || nextPrograms['default'];
        }

        // ==================== PLAYER INITIALIZATION ====================

        function initPlayer() {
            var streamUrl = loadChannelData();

            if (!streamUrl) {
                console.error('No stream URL provided. Please select a channel from TV Channels page.');
                showPlayerError('No stream URL. Please select a channel.');
                return;
            }

            // Set up player callbacks
            AVPlayer.setCallbacks({
                onPlay: function() {
                    console.log('Playback started');
                    hideBuffering();
                    AVPlayer.setFullScreen();
                    // Show info overlay briefly when playback starts
                    showInfoOverlay();
                },
                onPause: function() {
                    console.log('Playback paused');
                    showInfoOverlay();
                },
                onBufferingStart: function() {
                    console.log('Buffering started');
                    showBuffering();
                },
                onBufferingComplete: function() {
                    console.log('Buffering complete');
                    hideBuffering();
                },
                onBufferingProgress: function(percent) {
                    console.log('Buffering: ' + percent + '%');
                    updateBufferingProgress(percent);
                },
                onTimeUpdate: function(currentTime, duration) {
                    updateProgramProgress();
                },
                onError: function(type, error) {
                    console.error('Player error:', type, error);
                    showPlayerError('Playback error: ' + type);
                },
                onStreamComplete: function() {
                    console.log('Stream completed');
                }
            });

            // Initialize the player
            AVPlayer.init({
                url: streamUrl,
                containerId: 'video-wrapper',
                videoElementId: 'video-player',
                debug: true
            });
        }

        // ==================== BUFFERING UI ====================

        function showBuffering() {
            var existingIndicator = document.getElementById('buffering-indicator');
            if (existingIndicator) return;

            var container = document.querySelector('.video-wrapper');
            var indicator = document.createElement('div');
            indicator.id = 'buffering-indicator';
            indicator.className = 'buffering-indicator';
            indicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i><p>Loading...</p>';
            container.appendChild(indicator);
        }

        function hideBuffering() {
            var indicator = document.getElementById('buffering-indicator');
            if (indicator && indicator.parentNode) {
                indicator.parentNode.removeChild(indicator);
            }
        }

        function updateBufferingProgress(percent) {
            var indicator = document.getElementById('buffering-indicator');
            if (indicator) {
                var text = indicator.querySelector('p');
                if (text) {
                    text.textContent = 'Loading... ' + percent + '%';
                }
            }
        }

        // ==================== ERROR UI ====================

        function showPlayerError(message) {
            var container = document.querySelector('.video-wrapper');
            
            var existingError = document.querySelector('.player-error');
            if (existingError) {
                existingError.parentNode.removeChild(existingError);
            }
            
            var errorDiv = document.createElement('div');
            errorDiv.className = 'player-error';
            errorDiv.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;background:rgba(0,0,0,0.9);padding:40px;border-radius:16px;z-index:100;';
            errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:48px;color:#ffc107;margin-bottom:16px;display:block;"></i>' +
                '<p style="margin:0;font-size:18px;">' + message + '</p>' +
                '<button onclick="history.back()" style="margin-top:24px;padding:12px 32px;background:#ffc107;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px;">Go Back</button>';
            
            container.appendChild(errorDiv);
        }

        // ==================== CHANNEL DATA (Dynamic from API or localStorage) ====================

        var channelList = [];

        function loadChannelList() {
            try {
                var storedChannels = localStorage.getItem('bbnl_channels');
                if (storedChannels) {
                    channelList = JSON.parse(storedChannels);
                }
            } catch (e) {
                console.log('Could not load channel list');
            }

            // Fallback demo channels
            if (channelList.length === 0) {
                channelList = [
                    { num: '001', name: 'Colors Super TV', stream: '' },
                    { num: '002', name: 'Zee TV', stream: '' },
                    { num: '003', name: 'Star Plus', stream: '' },
                    { num: '004', name: 'Sony TV', stream: '' },
                    { num: '005', name: 'Udhaya TV', stream: '' },
                    { num: '006', name: 'Gemini TV', stream: '' },
                    { num: '007', name: 'Star Movies', stream: '' },
                    { num: '008', name: 'HBO', stream: '' }
                ];
            }
        }

        function switchToChannel(channelNum) {
            var found = null;
            for (var i = 0; i < channelList.length; i++) {
                if (channelList[i].num === channelNum || channelList[i].num === padNumber(channelNum, 3)) {
                    found = channelList[i];
                    break;
                }
            }

            if (found && found.stream) {
                var newUrl = 'player.html?title=' + encodeURIComponent(found.name) + 
                    '&stream=' + encodeURIComponent(found.stream) + 
                    '&channel=' + found.num;
                if (found.logo) newUrl += '&logo=' + encodeURIComponent(found.logo);
                window.location.href = newUrl;
            } else if (found) {
                // Channel exists but no stream - show error briefly
                alert('Channel ' + channelNum + ' - ' + found.name + '\nStream not available');
            }
        }

        // ==================== EVENT HANDLERS ====================

        // Initialize on load
        window.addEventListener('load', function() {
            loadChannelList();
            initPlayer();
            
            // Update time every second
            setInterval(function() {
                updateDateTime();
                updateProgramProgress();
            }, 1000);
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', function() {
            AVPlayer.destroy();
        });

        // Click anywhere to show/hide overlay
        document.querySelector('.player-container').addEventListener('click', function(e) {
            if (!e.target.closest('.channel-search-overlay') && !e.target.closest('.control-btn')) {
                toggleInfoOverlay();
            }
        });

        // ==================== KEYBOARD / REMOTE CONTROLS ====================

        document.addEventListener('keydown', function(e) {
            var keyCode = e.keyCode;
            
            switch (keyCode) {
                case 13: // Enter - Show overlay or Play/Pause
                    if (playerState.overlayVisible) {
                        var state = AVPlayer.getState();
                        if (state.isPlaying) {
                            AVPlayer.pause();
                        } else {
                            AVPlayer.play();
                        }
                    } else {
                        showInfoOverlay();
                    }
                    break;
                    
                case 37: // Left - Rewind
                    AVPlayer.jumpBackward(10000);
                    showInfoOverlay();
                    break;
                    
                case 39: // Right - Forward
                    AVPlayer.jumpForward(10000);
                    showInfoOverlay();
                    break;
                    
                case 38: // Up - Volume up
                    var volUp = Math.min(100, playerState.volume + 10);
                    AVPlayer.setVolume(volUp);
                    showVolumeIndicator(volUp);
                    break;
                    
                case 40: // Down - Volume down
                    var volDown = Math.max(0, playerState.volume - 10);
                    AVPlayer.setVolume(volDown);
                    showVolumeIndicator(volDown);
                    break;
                    
                case 10009: // Back
                    if (playerState.overlayVisible) {
                        hideInfoOverlay();
                    } else {
                        window.history.back();
                    }
                    e.preventDefault();
                    break;
                    
                case 457: // Info button
                    toggleInfoOverlay();
                    break;
                    
                case 415: // Play
                    AVPlayer.play();
                    break;
                    
                case 19: // Pause
                    AVPlayer.pause();
                    break;
                    
                case 413: // Stop
                    AVPlayer.stop();
                    break;
                    
                case 417: // Fast Forward
                    AVPlayer.jumpForward(30000);
                    break;
                    
                case 412: // Rewind
                    AVPlayer.jumpBackward(30000);
                    break;
                    
                case 427: // Channel Up
                    var nextNum = parseInt(playerState.channelNumber) + 1;
                    switchToChannel(padNumber(nextNum, 3));
                    break;
                    
                case 428: // Channel Down
                    var prevNum = Math.max(1, parseInt(playerState.channelNumber) - 1);
                    switchToChannel(padNumber(prevNum, 3));
                    break;
            }
            
            // Number keys (0-9) for channel switching
            if (keyCode >= 48 && keyCode <= 57) {
                var num = String.fromCharCode(keyCode);
                showChannelSearch(num);
            }
        });

        // ==================== CHANNEL SEARCH ====================

        var channelSearchOverlay = document.getElementById('channel-search-overlay');
        var channelNumberInput = document.getElementById('channel-number-input');
        var searchTimeout;

        function showChannelSearch(initialNum) {
            channelSearchOverlay.classList.add('show');
            channelNumberInput.focus();
            
            clearTimeout(searchTimeout);
            
            if (initialNum && channelNumberInput.value.length < 4) {
                channelNumberInput.value += initialNum;
            }
            
            searchTimeout = setTimeout(function() {
                var num = channelNumberInput.value;
                if (num) {
                    switchToChannel(num);
                }
                channelSearchOverlay.classList.remove('show');
                channelNumberInput.value = '';
            }, 2500);
        }

        channelNumberInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                var num = channelNumberInput.value;
                if (num) {
                    switchToChannel(num);
                }
                channelSearchOverlay.classList.remove('show');
                channelNumberInput.value = '';
            } else if (e.key === 'Escape' || e.keyCode === 10009) {
                clearTimeout(searchTimeout);
                channelSearchOverlay.classList.remove('show');
                channelNumberInput.value = '';
            }
        });

        channelNumberInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                var num = channelNumberInput.value;
                if (num) {
                    switchToChannel(num);
                }
                channelSearchOverlay.classList.remove('show');
                channelNumberInput.value = '';
            }, 2500);
        });
    </script>
</body>

</html>
